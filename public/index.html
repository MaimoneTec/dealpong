<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff0062" />
    <title>Dealpong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="stage">
      <div class="play-column">
        <header class="hud">
          <p class="brand">Dealpong</p>
          <p class="tag">pontos por tapa · proteja o fundo</p>
        </header>

        <div class="board-wrap">
          <canvas id="game" width="480" height="720" tabindex="0" aria-label="Campo do Dealpong"></canvas>

          <div id="overlay" class="overlay" role="dialog" aria-modal="true">
            <div class="panel">
              <p class="panel-kicker">pronto para jogar</p>
              <p id="message" class="panel-msg">Cada tapa na bola vale pontos × velocidade.</p>
              <div class="modes">
                <button type="button" id="btn-ai" class="mode active" data-mode="ai">1P · vs IA</button>
                <button type="button" id="btn-2p" class="mode" data-mode="2p">2P · local</button>
              </div>
              <div id="initials-field" class="initials-field">
                <label for="initials">Suas iniciais</label>
                <input
                  id="initials"
                  name="initials"
                  type="text"
                  maxlength="5"
                  minlength="5"
                  autocomplete="off"
                  spellcheck="false"
                  inputmode="text"
                  placeholder="XXXXX"
                  aria-describedby="initials-hint"
                />
                <p id="initials-hint" class="hint">Digite exatamente 5 caracteres para jogar vs IA.</p>
                <button type="button" id="btn-new-player" class="mode new-player hidden">New player</button>
              </div>
              <button type="button" id="btn-start" class="cta">Espaço · Jogar</button>
              <ul class="help">
                <li><span>P1</span> ← → / A D / touch</li>
                <li><span>P2</span> J L</li>
                <li><span>Pausa</span> Espaço</li>
              </ul>
            </div>
          </div>
        </div>

        <footer class="scoreboard" aria-live="polite">
          <div class="score">
            <span class="label">cima</span>
            <strong id="score-top">0</strong>
          </div>
          <div class="score center">
            <span class="label">tapas × vel.</span>
            <strong id="status">—</strong>
          </div>
          <div class="score right">
            <span class="label" id="label-bottom">baixo</span>
            <strong id="score-bottom">0</strong>
          </div>
        </footer>
      </div>

      <aside class="ranking" aria-labelledby="ranking-title">
        <div class="ranking-head">
          <h2 id="ranking-title">Ranking</h2>
          <p class="ranking-sub">tapas vs IA</p>
        </div>
        <ol id="ranking-list" class="ranking-list">
          <li class="empty">Carregando…</li>
        </ol>
      </aside>
    </div>
    <script src="/game.js"></script>
  </body>
</html>
